    <b>Bentuk molekul:</b> Trigonal bipiramidal<br>
    <b>Sudut ikatan ideal:</b> 90° & 120°
  </div>
  <script>
    document.querySelectorAll('model-viewer').forEach(function(mv) {
      const bar = mv.querySelector('.update-bar');
      mv.addEventListener('progress', function(e) { if(bar) bar.style.width = (e.detail.totalProgress*100)+'%'; });
      mv.addEventListener('load', function() { mv.setAttribute('loaded',''); });
    });
  </script>
</body>
</html>
